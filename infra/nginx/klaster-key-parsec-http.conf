# parsec.toolzar.ru / api.parsec.toolzar.ru — Парсек (/opt/parsec).
# Подготовлено 11.11.2026; применять с согласия владельца, дописывать cat >>, не заменять.

server {
    listen 80;
    server_name parsec.toolzar.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name api.parsec.toolzar.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
