# parsec.toolzar.ru / api.parsec.toolzar.ru — Парсек (/opt/parsec).
# Подготовлено 11.11.2026; применять с согласия владельца, дописывать cat >>, не заменять.

server {
    listen 80;
    server_name parsec.toolzar.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name api.parsec.toolzar.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name parsec.toolzar.ru;
    ssl_certificate /etc/letsencrypt/live/parsec.toolzar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parsec.toolzar.ru/privkey.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://172.18.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name api.parsec.toolzar.ru;
    ssl_certificate /etc/letsencrypt/live/parsec.toolzar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parsec.toolzar.ru/privkey.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://172.18.0.1:7101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
